services:
  - type: web
    name: ak-creations
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: POLLINATIONS_MODEL
        value: deepseek
      - key: CLOUDINARY_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DEVELOPER_EMAIL
        sync: false
      - key: CRON_SECRET
        generateValue: true

  # Separate 24/7 background worker (WhatsApp bot). Runs independently of the
  # site above; ping its URL with UptimeRobot so Render's free tier doesn't
  # spin it down.
  - type: web
    name: ak-whatsapp-bot
    runtime: python
    plan: free
    rootDir: whatsapp-bot
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: WA_AGENT_TOKEN
        sync: false
      - key: WA_AGENT_TOKEN_2
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_MODEL
        value: gpt-oss-120b
      - key: CEREBRAS_MODEL_2
        value: zai-glm-4.7
      - key: POLLINATIONS_API_KEY
        sync: false
