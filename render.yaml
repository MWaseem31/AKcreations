services:
  - type: web
    name: ak-creations
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: POLLINATIONS_MODEL
        value: deepseek
      - key: CLOUDINARY_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DEVELOPER_EMAIL
        sync: false
      - key: CRON_SECRET
        generateValue: true
